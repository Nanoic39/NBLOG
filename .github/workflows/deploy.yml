name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: NBLOG
    steps:
      - name: Validate deploy config
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
        run: |
          set -e
          [ -n "$DEPLOY_HOST" ] || (echo "Missing DEPLOY_HOST (set it in Environment/Repository secrets or Variables)" && exit 1)
          [ -n "$DEPLOY_USER" ] || (echo "Missing DEPLOY_USER (set it in Environment/Repository secrets or Variables)" && exit 1)
          [ -n "$DEPLOY_PATH" ] || (echo "Missing DEPLOY_PATH (set it in Environment/Repository secrets or Variables)" && exit 1)
          [ -n "$DEPLOY_SSH_KEY" ] || [ -n "$DEPLOY_SSH_KEY_B64" ] || (echo "Missing DEPLOY_SSH_KEY or DEPLOY_SSH_KEY_B64 (must be a PRIVATE key, not .pub)" && exit 1)

      - name: Prepare SSH key file
        id: sshkey
        env:
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
        run: |
          set -e
          if [ -n "$DEPLOY_SSH_KEY_B64" ]; then
            echo "$DEPLOY_SSH_KEY_B64" | base64 -d > /tmp/deploy_key
            chmod 600 /tmp/deploy_key
            echo "key_path=/tmp/deploy_key" >> "$GITHUB_OUTPUT"
          else
            echo "key_path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT || '22' }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          key_path: ${{ steps.sshkey.outputs.key_path }}
          script_stop: true
          script: |
            set -e
            source /etc/profile || true
            node_bin="$(ls -d /www/server/nodejs/v*/bin 2>/dev/null | sort -V | tail -n 1)"
            if [ -n "$node_bin" ]; then
              export PATH="$node_bin:$PATH"
            fi
            repo_dir="${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}"
            artifact_dir="${{ secrets.DEPLOY_ARTIFACT_DIR || vars.DEPLOY_ARTIFACT_DIR }}"
            repo_url="https://github.com/${{ github.repository }}.git"

            cd "$repo_dir"
            git remote set-url origin "$repo_url"
            git config --global http.version HTTP/1.1
            git config --global http.lowSpeedLimit 1000
            git config --global http.lowSpeedTime 30
            attempt=1
            max_attempts=3
            until git fetch --prune --tags origin; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "git fetch failed after $max_attempts attempts"
                exit 1
              fi
              sleep_seconds=$((attempt * 5))
              echo "git fetch failed, retrying in ${sleep_seconds}s (${attempt}/${max_attempts})"
              sleep "$sleep_seconds"
              attempt=$((attempt + 1))
            done
            git checkout main
            git pull --ff-only origin main
            npm ci
            npm run build

            if [ -n "$artifact_dir" ]; then
              mkdir -p "$artifact_dir"
              rsync -a --delete .output/ "$artifact_dir/.output/"
              rsync -a ecosystem.config.cjs "$artifact_dir/ecosystem.config.cjs"
              pm2 startOrReload "$artifact_dir/ecosystem.config.cjs" --update-env
            else
              pm2 startOrReload ecosystem.config.cjs --update-env
            fi
            pm2 save
